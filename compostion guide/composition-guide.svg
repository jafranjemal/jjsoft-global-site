<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101c"/><stop offset="1" stop-color="#02050b"/></linearGradient>
  <radialGradient id="g"><stop stop-color="#173955"/><stop offset=".7" stop-color="#071522"/><stop offset="1" stop-color="#02060c"/></radialGradient>
  <filter id="red"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="72" y="82" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="700">JJSOFT Hero — Target Product Showcase Composition</text>
<text x="72" y="120" fill="#8fa1b6" font-family="Arial,sans-serif" font-size="18">Schematic / not a render — use this to judge camera, overlap, depth and hierarchy.</text>
<rect x="70" y="160" width="1460" height="660" rx="28" fill="#030813" stroke="#1b2c3e"/>
<!-- globe -->
<circle cx="1020" cy="410" r="260" fill="url(#g)" stroke="#2b718d" stroke-width="7"/>
<ellipse cx="1020" cy="410" rx="285" ry="92" fill="none" stroke="#ff2948" stroke-opacity=".55" stroke-width="3" transform="rotate(-15 1020 410)"/>
<text x="935" y="192" fill="#79d6ff" font-family="Arial" font-size="20" font-weight="700">GLOBE — BACK</text>
<!-- stage -->
<polygon points="650,655 1310,655 1420,735 780,770 570,710" fill="#10151e" stroke="#242c39" stroke-width="3"/>
<path d="M735 681 Q990 728 1260 676" fill="none" stroke="#ff2143" stroke-width="14" stroke-linecap="round"/>
<text x="1090" y="790" fill="#9ba8b7" font-family="Arial" font-size="18">Smaller supporting pedestal</text>
<!-- laptop -->
<g transform="translate(650 430) rotate(-5)">
  <polygon points="0,0 310,-35 330,170 22,190" fill="#111821" stroke="#7d8b9c" stroke-width="4"/>
  <polygon points="-35,190 335,170 410,235 35,250" fill="#1b222d" stroke="#7d8b9c" stroke-width="4"/>
  <rect x="24" y="20" width="270" height="120" fill="#08111c" stroke="#ff2948" stroke-opacity=".6"/>
</g>
<text x="650" y="398" fill="#fff" font-family="Arial" font-size="20" font-weight="700">LAPTOP — LEFT / BACK</text>
<text x="650" y="424" fill="#9ba8b7" font-family="Arial" font-size="16">camera above reveals keyboard + hinge</text>
<!-- phone -->
<g transform="translate(980 510)">
  <rect x="0" y="0" width="104" height="215" rx="24" fill="#151d27" stroke="#b8c2ce" stroke-width="5"/>
  <rect x="10" y="12" width="84" height="190" rx="18" fill="#07111d"/>
  <rect x="37" y="20" width="30" height="7" rx="4" fill="#000"/>
</g>
<text x="920" y="760" fill="#ff516d" font-family="Arial" font-size="20" font-weight="700">PHONE — FRONT FOCAL POINT</text>
<!-- tablet -->
<g transform="translate(1190 390) rotate(5)">
  <rect x="0" y="0" width="165" height="300" rx="18" fill="#161d27" stroke="#8e9bac" stroke-width="5"/>
  <rect x="12" y="14" width="141" height="270" rx="12" fill="#06101b"/>
</g>
<text x="1210" y="355" fill="#fff" font-family="Arial" font-size="20" font-weight="700">TABLET — RIGHT / BACK</text>
<!-- camera -->
<path d="M420 290 C500 260 555 260 620 310" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-dasharray="8 10"/>
<circle cx="400" cy="300" r="18" fill="#fff"/><path d="M406 306 L635 540" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
<text x="170" y="285" fill="#fff" font-family="Arial" font-size="20" font-weight="700">CAMERA: raised + slightly downward</text>
<text x="170" y="315" fill="#9ba8b7" font-family="Arial" font-size="16">34° FOV • product photography, not flat front view</text>
<!-- depth arrows -->
<path d="M1110 585 L1110 500" stroke="#ff516d" stroke-width="4" marker-end="url(#none)"/>
<text x="1125" y="548" fill="#ff516d" font-family="Arial" font-size="16">clear Z separation</text>
</svg>
