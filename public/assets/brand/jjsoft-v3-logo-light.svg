<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="460" height="110">
  <defs>
    <linearGradient id="crimsonPrint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1837" />
      <stop offset="100%" stop-color="#cc001b" />
    </linearGradient>
  </defs>

  <!-- EMBLEM: Isometric Hex Ribbon Double-J -->
  <g transform="translate(14, 12)">
    <!-- Crimson Upper-Left Ribbon (First J + Crown) -->
    <path d="M 42 12
             L 15 27.6
             L 15 58.8
             L 30 67.5
             L 45 58.8
             L 45 42"
          fill="none" 
          stroke="url(#crimsonPrint)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Dark Charcoal Lower-Right Ribbon (Second J + Base) -->
    <path d="M 42 12
             L 69 27.6
             L 69 58.8
             L 42 74.4
             L 15 58.8"
          fill="none" 
          stroke="#090d16" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Inner Interlocking Stem of Second J -->
    <path d="M 54 36.5
             L 54 53.5
             L 42 60.5
             L 30 53.5"
          fill="none" 
          stroke="#090d16" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Upper Right Accent Pip -->
    <circle cx="56" cy="27" r="4.2" fill="#090d16" />
  </g>

  <!-- TYPOGRAPHY: JJSOFT GLOBAL -->
  <g transform="translate(118, 16)">
    <!-- Primary Brand Name: JJSOFT -->
    <text x="0" y="40" 
          font-family="'Outfit', 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="44" 
          font-weight="900" 
          fill="#090d16" 
          letter-spacing="-0.025em">JJSOFT</text>
    
    <!-- Subtitle: GLOBAL -->
    <text x="2" y="70" 
          font-family="'Outfit', 'Space Grotesk', 'Inter', sans-serif" 
          font-size="22" 
          font-weight="700" 
          fill="#1e293b" 
          letter-spacing="0.18em">GLOBAL</text>

    <!-- Crimson Badge: GLOBAL -->
    <g transform="translate(136, 52)">
      <rect x="0" y="0" width="76" height="22" rx="11" fill="url(#crimsonPrint)" />
      <text x="38" y="15.5" 
            font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
            font-size="11" 
            font-weight="900" 
            fill="#ffffff" 
            text-anchor="middle" 
            letter-spacing="0.08em">GLOBAL</text>
    </g>
  </g>
</svg>
