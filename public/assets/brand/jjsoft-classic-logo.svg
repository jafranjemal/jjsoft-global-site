<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220">
  <!-- Foliage Leaf Quadrants -->
  <g transform="translate(18, 42)">
    <!-- Top-Right Leaf (Grey Gradient) -->
    <path d="M 68 18 C 68 3 48 3 48 18 C 48 33 68 33 68 18 Z" fill="none" stroke="#64748b" stroke-width="3.5" />
    <path d="M 66 18 C 66 6 50 6 50 18 C 50 30 66 30 66 18 Z" fill="#1e293b" opacity="0.6" />

    <!-- Top-Left Leaf (Silver Outline) -->
    <path d="M 40 24 C 25 24 25 44 40 44 C 55 44 55 24 40 24 Z" fill="none" stroke="#94a3b8" stroke-width="3.5" />

    <!-- Center-Right Leaf (Bright Golden Yellow) -->
    <path d="M 68 44 C 68 28 50 28 50 44 C 50 60 68 60 68 44 Z" fill="#FFE600" />
    <path d="M 68 44 C 68 28 50 28 50 44 C 50 60 68 60 68 44 Z" fill="none" stroke="#000000" stroke-width="1.5" />

    <!-- Bottom-Left Leaf (Silver Outline with Yellow Core) -->
    <path d="M 40 50 C 25 50 25 70 40 70 C 55 70 55 50 40 50 Z" fill="none" stroke="#94a3b8" stroke-width="3.5" />
    <circle cx="40" cy="60" r="4.5" fill="#FFE600" />
  </g>

  <!-- First J (Foreground / Left) -->
  <path d="M 94 48 L 138 48 L 138 126 C 138 142 124 154 106 154 C 88 154 78 142 78 128" 
        fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter" />

  <!-- Second J (Background / Offset Right) -->
  <path d="M 146 66 L 172 66 L 172 152 C 172 168 158 178 140 178 C 122 178 116 168 116 158" 
        fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter" />

  <!-- Typography: S O F T -->
  <!-- S -->
  <path d="M 242 104 C 220 104 200 104 194 104 C 184 104 182 110 182 118 C 182 132 200 134 224 136 C 242 138 244 148 244 156 C 244 164 238 170 220 170 C 200 170 184 170 184 170" 
        fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="square" />

  <!-- Wireframe 3D Globe for 'O' -->
  <g transform="translate(284, 137)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#ffffff" stroke-width="3.5" />
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#ffffff" stroke-width="2.5" />
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#ffffff" stroke-width="2.5" />
    <ellipse cx="0" cy="0" rx="15" ry="26" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <ellipse cx="0" cy="0" rx="26" ry="13" fill="none" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- F -->
  <g transform="translate(322, 110)">
    <path d="M 0 60 L 0 0 L 46 0" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="square" />
    <path d="M 0 26 L 36 26" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="square" />
  </g>

  <!-- T -->
  <g transform="translate(382, 110)">
    <path d="M 24 60 L 24 0" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="square" />
    <path d="M 0 0 L 48 0" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="square" />
  </g>

  <!-- Red Banner: GLOBAL -->
  <g transform="translate(182, 178)">
    <rect x="0" y="0" width="268" height="22" fill="#ff0000" />
    <text x="134" y="16.5" 
          font-family="'Space Grotesk', 'Courier New', monospace" 
          font-size="14.5" 
          font-weight="900" 
          letter-spacing="0.4em" 
          fill="#ffffff" 
          text-anchor="middle">GLOBAL</text>
  </g>
</svg>
